# The build has 8 GB of RAM to share with everything else on this host.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Both flags mirror the only other Android build proven on this machine (the Tahseel phone app):
# AGP 9 ships a new DSL and a built-in Kotlin support, and this project uses the Kotlin plugin instead.
android.newDsl=false
android.builtInKotlin=false
